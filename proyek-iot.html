<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Kualitas Air | IoT Project</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style-iot.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Monitoring Air IoT</h1>
            <p>Real-time Data Transmission via ESP32</p>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div class="icon-box temp-icon">
                    <i class="fa-solid fa-temperature-three-quarters"></i>
                </div>
                <h3>Suhu Air</h3>
                <div class="value">28.5<span class="unit">°C</span></div>
                <div class="status-badge">Normal</div>
            </div>

            <div class="card">
                <div class="icon-box tds-icon">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <h3>Kualitas Air (TDS)</h3>
                <div class="value">142<span class="unit">PPM</span></div>
                <div class="status-badge">Baik / Layak</div>
            </div>
        </div>

        <div class="tech-info">
            <h3>Spesifikasi Perangkat</h3>
            <div class="info-grid">
                <div class="info-item">
                    <label>Mikrokontroler</label>
                    <p>ESP32 DevKit V1</p>
                </div>
                <div class="info-item">
                    <label>Sensor Suhu</label>
                    <p>DS18B20 (Waterproof)</p>
                </div>
                <div class="info-item">
                    <label>Sensor TDS</label>
                    <p>Gravity Analog TDS</p>
                </div>
                <div class="info-item">
                    <label>Update Rate</label>
                    <p>Setiap 5 Detik</p>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="index.html" class="btn btn-back">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Portfolio
            </a>
            <a href="https://github.com/username/repository" class="btn btn-github">
                <i class="fa-brands fa-github"></i> Source Code
            </a>
        </div>
    </div>

</body>
</html>
